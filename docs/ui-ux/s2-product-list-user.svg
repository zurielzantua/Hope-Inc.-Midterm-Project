    <ns0:text x="304" y="625" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Only active products are shown. Status and Stamp columns are hidden.</ns0:text>
    <ns0:text x="304" y="650" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">— means no active price is effective as of today; future-dated prices do not count as current.</ns0:text>
    <ns0:text x="304" y="675" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Add, Edit and Delete price controls appear only with add_price, edit_price and delete_price rights.</ns0:text>
