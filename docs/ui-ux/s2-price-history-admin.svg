    <ns0:text x="304" y="687" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Admin sees Status and Stamp; inactive rows are shaded. Restore is not a price-history action in this wireframe.</ns0:text>
    <ns0:text x="304" y="712" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Future-dated rows remain in history but do not replace the current price until effective.</ns0:text>
