    <ns0:text x="1074" y="268" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">• Cust No. is read-only while editing.</ns0:text>
