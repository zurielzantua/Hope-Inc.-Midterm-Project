    <ns0:rect x="280" y="566" width="1136" height="138" rx="10" fill="#EDF5F5" stroke="#C7DEDF" stroke-width="1" />
    <ns0:text x="304" y="598" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#0B6E75" text-anchor="start">USER VIEW &amp; PRICE BEHAVIOR</ns0:text>
    <ns0:text x="304" y="631" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Only active history rows are shown. Status and Stamp are hidden.</ns0:text>
    <ns0:text x="304" y="656" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Future-dated prices remain visible in history but are not treated as current.</ns0:text>
    <ns0:text x="304" y="681" font-family="Aptos, Segoe UI, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#1A2B35" text-anchor="start">Price write controls are hidden unless the matching per-action right is granted.</ns0:text>
